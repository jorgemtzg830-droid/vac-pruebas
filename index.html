
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>V.A.C. - Recuperar contraseña</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f8;
      margin: 0;
      padding: 24px;
      color: #26383a;
    }
    main {
      max-width: 440px;
      margin: 40px auto;
      padding: 26px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 3px 18px #00000012;
    }
    h1 { color: #267967; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border-radius: 9px;
      font-size: 16px;
    }
    input { border: 1px solid #b8c7c9; }
    button {
      background: #267967;
      color: white;
      border: none;
      font-weight: bold;
    }
    button:disabled { opacity: .5; }
    #mensaje { line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>V.A.C.</h1>
    <p>Vida, Amor y Cuidados</p>
    <h2>Recuperar contraseña</h2>
    <p id="mensaje">Verificando enlace de recuperación...</p>

    <form id="formulario" hidden>
      <label for="clave">Nueva contraseña</label>
      <input id="clave" type="password"
             minlength="12" autocomplete="new-password"
             required>

      <label for="confirmacion">Confirmar contraseña</label>
      <input id="confirmacion" type="password"
             minlength="12" autocomplete="new-password"
             required>

      <button id="guardar" type="submit">
        Guardar nueva contraseña
      </button>
    </form>
  </main>

  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";

    const supabase = createClient(
      "https://fnpeipvsfwroseabfxnm.supabase.co",
      "sb_publishable_IKdwFUH__y9RRt4t16dchg_6nib_8NR",
      {
        auth: {
          detectSessionInUrl: true,
          persistSession: false,
          autoRefreshToken: false
        }
      }
    );

    const mensaje = document.getElementById("mensaje");
    const formulario = document.getElementById("formulario");
    const guardar = document.getElementById("guardar");

    const parametros = new URLSearchParams(location.search);
    const codigo = parametros.get("code");
    const hash = new URLSearchParams(location.hash.slice(1));
    const esRecuperacion =
      hash.get("type") === "recovery" ||
      parametros.get("type") === "recovery";

    async function iniciar() {
      try {
        let sesion = null;

        if (codigo) {
          const resultado =
            await supabase.auth.exchangeCodeForSession(codigo);
          if (resultado.error) throw resultado.error;
          sesion = resultado.data.session;
        } else {
          const resultado = await supabase.auth.getSession();
          if (resultado.error) throw resultado.error;
          sesion = resultado.data.session;
        }

        history.replaceState({}, "", location.pathname);

        if (!sesion) {
          mensaje.textContent =
            "Enlace inválido o vencido. Solicita uno nuevo.";
          return;
        }

        if (!esRecuperacion) {
          mensaje.textContent =
            "Este enlace no corresponde a una recuperación.";
          await supabase.auth.signOut();
          return;
        }

        mensaje.textContent =
          "Introduce tu nueva contraseña de al menos 12 caracteres.";
        formulario.hidden = false;
      } catch (error) {
        history.replaceState({}, "", location.pathname);
        mensaje.textContent =
          "No se pudo validar el enlace. Solicita uno nuevo.";
      }
    }

    formulario.addEventListener("submit", async (evento) => {
      evento.preventDefault();

      const clave = document.getElementById("clave").value;
      const confirmacion =
        document.getElementById("confirmacion").value;

      if (clave !== confirmacion) {
        mensaje.textContent =
          "Las contraseñas no coinciden.";
        return;
      }

      guardar.disabled = true;
      const { error } =
        await supabase.auth.updateUser({ password: clave });

      if (error) {
        mensaje.textContent =
          "No se pudo cambiar la contraseña: " + error.message;
        guardar.disabled = false;
        return;
      }

      formulario.hidden = true;
      mensaje.textContent =
        "Contraseña actualizada correctamente. Ya puedes iniciar sesión.";
      await supabase.auth.signOut();
    });

    iniciar();
  </script>
</body>
</html>
